# moved from: Code/05 Environment Variables & Secrets/01 Starting Project/.github/workflows/deploy.yml
# TEORIE: "secrets.X" - hodnoty ulozene v Settings > Secrets, nikdy nejsou videt v logu (GitHub je automaticky maskuje).
# "env:" na urovni jobu vs workflow - viz komentar v sesterskem "02 Finished" workflow souboru.
name: "[05 Env Vars & Secrets / 01 Starting] Deployment"
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'Code/05 Environment Variables & Secrets/01 Starting Project/**'
defaults:
  run:
    working-directory: Code/05 Environment Variables & Secrets/01 Starting Project
env:
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    env:
      MONGODB_CLUSTER_ADDRESS: cluster0.ntrwp.mongodb.net
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      PORT: 8080
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('Code/05 Environment Variables & Secrets/01 Starting Project/**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT # requires MongoDB Atlas to accept requests from anywhere!
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        env:
          PORT: 3000 # step-level env prebiji job-level PORT: 8080 jen pro tento konkretni krok
        run: |        
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME"
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          echo "${{ env.PORT }}"
