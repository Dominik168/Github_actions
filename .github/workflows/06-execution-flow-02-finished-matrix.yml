# moved from: Code/06 Execution Flow/02 Finished Project/.github/workflows/matrix.yml
# TEORIE: "strategy.matrix" spusti job jednou pro KAZDOU kombinaci hodnot (zde 3 node verze x 2 OS = 6 behu,
# minus "exclude" kombinace, plus "include" pridava jednu extra kombinaci navic).
# "continue-on-error: true" na jobu - pokud jedna kombinace selze, ostatni beziici v matici pokracuji dal (nezablokuji se navzajem).
name: "[06 Execution Flow / 02 Finished] Matrix Demo"
on:
  push:
    paths:
      - 'Code/06 Execution Flow/02 Finished Project/**'
defaults:
  run:
    working-directory: Code/06 Execution Flow/02 Finished Project
jobs:
  build:
    continue-on-error: true
    strategy:
      matrix:
        node-version: [12, 14, 16]
        operating-system: [ubuntu-latest, windows-latest]
        include:
          - node-version: 18
            operating-system: ubuntu-latest
        exclude:
          - node-version: 12
            operating-system: windows-latest
    runs-on: ${{ matrix.operating-system }} # dynamicky runner podle aktualni kombinace v matici
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }} # hodnota z aktualni bunky matice
      - name: Install Dependencies
        run: npm ci
      - name: Build project
        run: npm run build
