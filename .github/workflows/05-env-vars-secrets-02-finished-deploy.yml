# moved from: Code/05 Environment Variables & Secrets/02 Finished Project/.github/workflows/deploy.yml
# TEORIE: hierarchie env promennych - workflow-level env < job-level env < step-level env (nizsi uroven prebiji vyssi).
# "${{ secrets.* }}" jde pouzit i primo v env: mapovani (ne jen v run:), stale se maskuje v logu.
name: "[05 Env Vars & Secrets / 02 Finished] Deployment (Container)"
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'Code/05 Environment Variables & Secrets/02 Finished Project/**'
defaults:
  run:
    working-directory: Code/05 Environment Variables & Secrets/02 Finished Project
env:
  CACHE_KEY: node-deps
  MONGODB_DB_NAME: gha-demo
jobs:
  test:
    environment: testing
    runs-on: ubuntu-latest
    env:
      MONGODB_CONNECTION_PROTOCOL: mongodb+srv
      MONGODB_CLUSTER_ADDRESS: cluster0.ntrwp.mongodb.net
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      PORT: 8080
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('Code/05 Environment Variables & Secrets/02 Finished Project/**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT # requires MongoDB Atlas to accept requests from anywhere!
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        env:
          PORT: 3000 # prebiji job-level PORT jen pro tento krok
        run: |        
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME"
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          echo "${{ env.PORT }}"
