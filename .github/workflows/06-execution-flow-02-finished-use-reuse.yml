# moved from: Code/06 Execution Flow/02 Finished Project/.github/workflows/use-reuse.yml
# TEORIE: job "deploy" nema "runs-on" ani "steps" - misto toho "uses:" odkazuje na jiny workflow soubor (reusable workflow).
# Vstupy se predavaji pres "with:", vystup volaneho workflow je pak dostupny jako "needs.deploy.outputs.result".
name: "[06 Execution Flow / 02 Finished] Using Reusable Workflow"
on:
  push:
    branches:
      - main
    paths:
      - 'Code/06 Execution Flow/02 Finished Project/**'
defaults:
  run:
    working-directory: Code/06 Execution Flow/02 Finished Project
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: Code/06 Execution Flow/02 Finished Project/node_modules
          key: deps-node-modules-${{ hashFiles('Code/06 Execution Flow/02 Finished Project/**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Lint code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: Code/06 Execution Flow/02 Finished Project/node_modules
          key: deps-node-modules-${{ hashFiles('Code/06 Execution Flow/02 Finished Project/**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test code
        id: run-tests
        run: npm run test
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure' # nahraje report jen pri selhani testu
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: Code/06 Execution Flow/02 Finished Project/test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: Code/06 Execution Flow/02 Finished Project/node_modules
          key: deps-node-modules-${{ hashFiles('Code/06 Execution Flow/02 Finished Project/**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build website
        id: build-website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-files
          path: Code/06 Execution Flow/02 Finished Project/dist
  deploy:
    needs: build
    # local reusable workflow - path always resolves relative to repo root, both files now live in the same folder
    uses: ./.github/workflows/06-execution-flow-02-finished-reusable.yml
    with:
      artifact-name: dist-files
  print-deploy-result:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Print deploy output
        run: echo "${{ needs.deploy.outputs.result }}"
  report:
    needs: [lint, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: | 
          echo "Something went wrong"
          echo "${{ toJSON(github) }}"
