# moved from: Code/04 Artifacts & Outputs/03 Finished Project/.github/workflows/demo.yml
# TEORIE (cesky prehled): tento soubor demonstruje 2 klicove mechanismy predavani dat mezi joby (kazdy job = vlastni izolovana VM):
# 1) "artifacts" (actions/upload-artifact + download-artifact) - predavaji CELE SOUBORY (napr. slozku dist/)
# 2) "outputs" (jobs.<id>.outputs + needs.<id>.outputs) - predavaji jen MALE TEXTOVE HODNOTY (napr. jmeno souboru)
# Workflow = top-level automation unit, lives in .github/workflows/*.yml, triggered by events on the repo.
name: "[04 Artifacts & Outputs / 03 Finished] Deploy website"

# "on" defines the trigger(s). Multiple events/filters possible (push, pull_request, workflow_dispatch, schedule, ...).
on:
  push:
    branches:
      - main # only pushes to main trigger this workflow (feature branches won't run it)
    # scope trigger to this project's own subfolder only - other projects' pushes won't run it
    paths:
      - 'Code/04 Artifacts & Outputs/03 Finished Project/**'

# repo is still checked out whole; this just makes every "run:" step below cd into the project subfolder first
defaults:
  run:
    working-directory: Code/04 Artifacts & Outputs/03 Finished Project

# "jobs" = collection of jobs. Each job runs in its own fresh virtual machine (runner), in parallel by default.
jobs:
  # ---------------------------------------------------------------------
  # JOB 1: test
  # Goal: install deps, lint, run unit tests. No "needs" -> runs first / independently.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest # picks a hosted runner image (fresh VM, torn down after job finishes)
    steps:
      # Steps run sequentially inside the SAME runner/VM, sharing filesystem & shell state.
      - name: Get code
        uses: actions/checkout@v3 # clones the repo into the runner's workspace (without this, workspace is empty)

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          # cache "path" is always relative to $GITHUB_WORKSPACE (repo root), NOT affected by "defaults.run.working-directory"
          path: ~/.npm # folder to persist between workflow runs (npm's global cache, not node_modules itself)
          # key uniquely identifies the cache entry; hashFiles() hashes lockfile content
          # -> cache hit only if lockfile is unchanged since last run, saving download time
          key: deps-node-modules-${{ hashFiles('Code/04 Artifacts & Outputs/03 Finished Project/**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci # "clean install": uses package-lock.json exactly, faster & more reproducible than "npm install"

      - name: Lint code
        run: npm run lint # runs project's lint script (e.g. ESLint) - fails job (non-zero exit) if lint errors found

      - name: Test code
        run: npm run test # runs project's test script; non-zero exit code stops the workflow here

  # ---------------------------------------------------------------------
  # JOB 2: build
  # "needs: test" -> creates dependency, this job waits for "test" to succeed first (turns parallel jobs into pipeline)
  # ---------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    # Jobs run in isolated VMs -> outputs is the mechanism to pass small values (not files!) between jobs.
    outputs:
      script-file: ${{ steps.publish.outputs.script-file }} # exposes this job's step output to jobs that "need" build
    steps:
      # Fresh VM again -> repo must be checked out again, cache must be restored again (nothing persists automatically).
      - name: Get code
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('Code/04 Artifacts & Outputs/03 Finished Project/**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build # produces production build, typically into ./dist

      - name: Publish JS filename
        id: publish # step id required so other steps/jobs can reference "steps.publish.outputs.*"
        # finds the built JS file (filename contains a content hash) and writes it as a step output
        # syntax: `name=value` appended to file at $GITHUB_OUTPUT -> readable via steps.<id>.outputs.<name>
        run: find dist/assets/*.js -type f -execdir echo 'script-file={}' >> $GITHUB_OUTPUT ';'

      - name: Upload artifacts
        uses: actions/upload-artifact@v3 # artifacts = files persisted after job ends, downloadable by later jobs/UI
        with:
          name: dist-files # artifact identifier, used by "download-artifact" in the deploy job
          # upload "path" is also always relative to repo root, not to working-directory
          path: Code/04 Artifacts & Outputs/03 Finished Project/dist

  # ---------------------------------------------------------------------
  # JOB 3: deploy
  # "needs: build" -> only runs if build succeeded; also gets access to build's declared outputs.
  # ---------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build artifacts
        uses: actions/download-artifact@v3 # downloads artifact uploaded earlier, restores files into this fresh VM
        with:
          name: dist-files # must match the name used in upload-artifact

      - name: Output contents
        run: ls # sanity check - lists downloaded files

      - name: Output filename
        # cross-job data flow: needs.<job_id>.outputs.<output_name>
        run: echo "${{ needs.build.outputs.script-file }}"

      - name: Deploy
        run: echo "Deploying..." # placeholder - real deploy would push dist/ to hosting (e.g. rsync, scp, cloud CLI)
