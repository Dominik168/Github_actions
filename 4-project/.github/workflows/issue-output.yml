# ============================================
# WORKFLOW #2: Output Issue Event Details
# ============================================
# Co to dělá?
# - Poslouchá na GitHub ISSUES (když někdo vytvoří/upraví/zavře issue)
# - Vypíše detaily o tom co se stalo
# - Např.: kdo vytvořil issue, jaký to má název, kdy to bylo, atd.
#
# Proč to máme?
# - Testovat jak GitHub Actions reaguje na eventy
# - Vidět jaké informace GitHub posílá
# - Automaticky logovat změny v issues

name: Output Event Details

# ============================================
# TRIGGER - Kdy se workflow spustí?
# ============================================
# 'issues' = poslouchej na GitHub issues event
# types: [opened, edited, closed] = spusť se když:
#   - opened = někdo VYTVOŘÍ novou issue
#   - edited = někdo UPRAVÍ existující issue
#   - closed = někdo ZAVŘE issue
#
# Pokud by byl jen 'issues:' bez types, spustil by se na VŠECHNY změny
on:
  issues:
    types: [opened, edited, closed]

jobs:
  # ============================================
  # JOB: Output Event Details
  # ============================================
  # Co dělá?
  # - Vypíše všechny detaily o issue eventu
  # - Použijeme GitHub context (speciální proměnné)
  # - Context = informace o eventu co se právě stalo
  output-details:
    runs-on: ubuntu-latest
    steps:
      # Krok 1: Vypis všech event detailů
      # Jak to funguje?
      # - Používáme ${{ github.XXX }} - to jsou speciální proměnné od GitHubu
      # - github.event_name = typ eventu (issues, push, pull_request, atd.)
      # - github.event.action = co se stalo (opened, edited, closed)
      # - github.event.issue.* = detaily o issue
      #
      # Příklad output:
      # Event: issues
      # Action: opened
      # Issue number: 42
      # Issue title: Add dark mode
      # Issue author: john_doe
      # Repository: john_doe/my-app
      # Timestamp: 2026-08-15T10:30:00Z
      - name: Output event payload
        run: |
          echo "=== Event Details ==="
          echo "Event: ${{ github.event_name }}"
          echo "Action: ${{ github.event.action }}"
          echo "Issue number: ${{ github.event.issue.number }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo "Issue author: ${{ github.event.issue.user.login }}"
          echo "Repository: ${{ github.repository }}"
          echo "Timestamp: ${{ github.event.issue.created_at }}"

